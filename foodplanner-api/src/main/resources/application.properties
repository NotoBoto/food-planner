spring.application.name=foodplanner-api
server.port=5199

# Standardwerte und POSTGRES_*-Variablen wie beim Service db in docker-compose.yml
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:foodplanner}
spring.datasource.username=${POSTGRES_USER:foodplanner}
spring.datasource.password=${POSTGRES_PASSWORD:foodplanner}
# §5.5: Schwelle der Trigramm-Suche je Pool-Verbindung; der Datenbank-Default 0.6 ist für Wortteile zu streng
spring.datasource.hikari.connection-init-sql=SET pg_trgm.word_similarity_threshold = 0.4

# §5.1: Health auf /health, sonst kein Actuator-Endpunkt. Datenbank-Check und show-details=never bleiben Standard.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
# Bei base-path=/ schaltet Boot die Discovery-Seite selbst ab; die Zeile sichert das ausdrücklich ab.
management.endpoints.web.discovery.enabled=false
# Boot legt sonst die Probe-Gruppen liveness/readiness unter /health/* an; §5.1 kennt nur /health.
management.endpoint.health.probes.enabled=false
