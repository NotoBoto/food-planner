spring.application.name=foodplanner-ingestion
spring.main.web-application-type=none
spring.main.banner-mode=off

http.user-agent=${HTTP_USER_AGENT:}
ingestion.aldi-max-products=${INGESTION_ALDI_MAX_PRODUCTS:100}
ingestion.scrape-concurrency=${INGESTION_SCRAPE_CONCURRENCY:4}
ingestion.scrape-delay-seconds=${INGESTION_SCRAPE_DELAY_SECONDS:0.2}
ingestion.aldi-base-url=${INGESTION_ALDI_BASE_URL:https://www.aldi-sued.de}
ingestion.aldi-sitemap-path=${INGESTION_ALDI_SITEMAP_PATH:/sitemap_products.xml}

# Standardwerte und POSTGRES_*-Variablen wie beim Service db in docker-compose.yml
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:foodplanner}
spring.datasource.username=${POSTGRES_USER:foodplanner}
spring.datasource.password=${POSTGRES_PASSWORD:foodplanner}
